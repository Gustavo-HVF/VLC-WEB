  </script>

  <div id="app" class="app" tabindex="-1">
    <nav id="menubar" class="menubar" role="menubar" aria-label="Menu principal"></nav>

    <main class="main">
      <section id="stage" class="stage" aria-label="Área de vídeo">
        <video id="video-main" class="media-el" playsinline preload="auto"></video>
        <video id="video-raw" class="media-el" playsinline preload="auto"></video>
        <canvas id="gl-canvas" class="gl-canvas"></canvas>
        <canvas id="vis-canvas" class="vis-canvas"></canvas>

        <div id="art-view" class="art-view" hidden>
          <img id="art-img" alt="Capa do álbum" hidden>
          <div id="art-placeholder" class="art-placeholder"><svg class="ico"><use href="#i-music"/></svg></div>
          <div class="art-meta"><div id="art-title" class="art-title"></div><div id="art-sub" class="art-sub"></div></div>
        </div>

        <div id="welcome" class="welcome">
          <img src="assets/icon.svg" alt="" class="welcome-logo" width="112" height="112">
          <h1>VLC Web</h1>
          <p>Arraste arquivos, pastas, legendas ou URLs para cá — ou escolha uma opção:</p>
          <div class="welcome-actions">
            <button type="button" class="btn big" data-action="open-file"><svg class="ico"><use href="#i-file"/></svg>Abrir arquivo</button>
            <button type="button" class="btn big" data-action="open-folder"><svg class="ico"><use href="#i-folder"/></svg>Abrir pasta</button>
            <button type="button" class="btn big" data-action="open-network"><svg class="ico"><use href="#i-network"/></svg>Abrir URL</button>
            <button type="button" class="btn big" data-action="open-capture"><svg class="ico"><use href="#i-capture"/></svg>Capturar</button>
          </div>
          <div id="welcome-recent" class="welcome-recent" hidden></div>
          <p class="welcome-hint">Pressione <kbd>F1</kbd> para ajuda e atalhos · <kbd>Ctrl+E</kbd> efeitos · <kbd>Ctrl+P</kbd> preferências</p>
        </div>

        <div id="subs-layer" class="subs-layer" aria-live="polite"></div>

        <div id="osd-title" class="osd osd-title"></div>
        <div id="osd-text" class="osd osd-text" role="status"></div>
        <div id="osd-center" class="osd-center"><svg class="ico"><use href="#i-play"/></svg></div>
        <div id="osd-snap" class="osd-snap"></div>
        <div id="zoom-map" class="zoom-map"><div class="zoom-rect"></div></div>
        <div id="rec-indicator" class="rec-indicator" hidden><span class="rec-dot"></span>REC <span id="rec-time">00:00</span></div>

        <div id="resume-bar" class="resume-bar" hidden>
          <span id="resume-text"></span>
          <button type="button" id="resume-yes" class="btn small primary">Continuar</button>
          <button type="button" id="resume-no" class="icon-btn" aria-label="Fechar"><svg class="ico"><use href="#i-close"/></svg></button>
        </div>
      </section>

      <aside id="playlist-panel" class="playlist-panel" hidden aria-label="Lista de reprodução">
        <div id="pl-resizer" class="pl-resizer" aria-hidden="true"></div>
        <div id="pl-head" class="pl-head">
          <div id="pl-tabs" class="pl-tabs" role="tablist"></div>
          <div class="pl-tools">
            <input id="pl-search" type="search" placeholder="Pesquisar na lista…" aria-label="Pesquisar">
            <button type="button" id="pl-dock" class="icon-btn" title="Desencaixar"><svg class="ico"><use href="#i-dock"/></svg></button>
            <button type="button" id="pl-close" class="icon-btn" title="Fechar lista (Ctrl+L)"><svg class="ico"><use href="#i-close"/></svg></button>
          </div>
        </div>
        <div id="pl-list" class="pl-list" tabindex="0" role="grid" aria-label="Itens"></div>
        <div id="pl-foot" class="pl-foot"></div>
      </aside>
    </main>

    <footer id="controls" class="controls">
      <div class="seek-row">
        <span id="time-elapsed" class="time" title="Ir para o tempo (Ctrl+T)">--:--</span>
        <div id="seekbar" class="seekbar" role="slider" tabindex="0" aria-label="Posição" aria-valuemin="0">
          <div class="seek-track"><div class="seek-buffer"></div><div class="seek-fill"></div></div>
          <div class="seek-marks"></div>
          <div class="seek-handle"></div>
          <div id="seek-tip" class="seek-tip" hidden></div>
        </div>
        <span id="time-total" class="time" title="Clique para alternar entre duração e tempo restante">--:--</span>
      </div>
      <div class="bars">
        <div id="advbar" class="toolbar adv" hidden></div>
        <div id="toolbar" class="toolbar main-bar"></div>
      </div>
    </footer>

    <div id="statusbar" class="statusbar">
      <span id="status-text" class="status-text">Pronto</span>
      <button type="button" id="status-rate" class="status-rate" title="Velocidade de reprodução">1.0x</button>
      <span id="status-time" class="status-time"></span>
    </div>

    <div id="drop-overlay" class="drop-overlay" hidden><div><svg class="ico"><use href="#i-plus"/></svg><p>Solte para reproduzir</p></div></div>
  </div>

  <div id="skin-fx" aria-hidden="true"></div>

  <div id="ff-toast" class="ff-toast" hidden>
    <div class="ff-row"><svg class="ico"><use href="#i-codec"/></svg><span id="ff-label">FFmpeg</span><span id="ff-pct"></span>
      <button type="button" class="icon-btn" id="ff-cancel" title="Cancelar" onclick="VW.app && (VW.app.ffmpeg.cancel(), VW.app.showFFProgress(null))"><svg class="ico"><use href="#i-close"/></svg></button></div>
    <div class="f-progress"><div id="ff-bar" class="f-progress-bar"></div></div>
  </div>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="windows"></div>

  <noscript><div class="fatal">O VLC Web precisa de JavaScript habilitado.</div></noscript>

  <script src="js/media/recorder.js"></script>
  <script src="js/ui/win.js"></script>

  <script src="js/ui/actions.js"></script>
  <script src="js/ui/controls.js"></script>

</body>
</html>
